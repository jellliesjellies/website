<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>jellliesjellies</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400;1,9..144,500&family=Work+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --sky: #BBDCE8;
    --lilac: #CBBBE6;
    --blossom: #E6BFD8;
    --ink: #4A4258;
    --ink-soft: #7B7188;
    --card: rgba(255,255,255,0.42);
    --card-line: rgba(255,255,255,0.65);
  }

  *{ margin:0; padding:0; box-sizing:border-box; }
  html{ scroll-behavior: smooth; }

  body{
    font-family: 'Work Sans', sans-serif;
    font-weight: 300;
    color: var(--ink);
    background: linear-gradient(160deg, var(--sky) 0%, var(--lilac) 52%, var(--blossom) 100%);
    min-height: 100vh;
  }

  .display{ font-family: 'Fraunces', serif; }

  header{
    display:flex;
    justify-content: space-between;
    align-items:center;
    padding: 2rem clamp(1.5rem, 6vw, 4rem);
  }
  .wordmark{
    font-size: 1.05rem;
    letter-spacing: 0.01em;
    font-weight: 500;
    color: var(--ink);
  }
  .insta-link{
    width: 40px; height: 40px;
    border-radius: 50%;
    display:flex; align-items:center; justify-content:center;
    background: var(--card);
    border: 1px solid var(--card-line);
    color: var(--ink);
    transition: transform 0.3s ease, background 0.3s ease;
  }
  .insta-link:hover{ transform: translateY(-2px); background: rgba(255,255,255,0.65); }
  .insta-link svg{ width: 18px; height: 18px; }

  /* ---------- hero ---------- */
  .hero{
    display:flex;
    flex-direction: column;
    align-items:center;
    text-align:center;
    padding: 2.5rem clamp(1.5rem, 6vw, 4rem) 4.5rem;
  }
  .avatar{
    width: 128px;
    height: 128px;
    border-radius: 50%;
    overflow: hidden;
    border: 3px solid rgba(255,255,255,0.75);
    box-shadow: 0 12px 30px rgba(74,66,88,0.18);
    margin-bottom: 1.6rem;
  }
  .avatar img{
    width:100%; height:100%; object-fit: cover; display:block;
  }
  .hero h1{
    font-size: clamp(1.9rem, 4.5vw, 2.6rem);
    font-weight: 500;
  }
  .hero .tagline{
    margin-top: 0.6rem;
    font-style: italic;
    font-family: 'Fraunces', serif;
    font-size: 1.15rem;
    color: var(--ink-soft);
  }
  .hero p.sub{
    margin-top: 1.4rem;
    max-width: 40ch;
    font-size: 0.98rem;
    line-height: 1.7;
    color: var(--ink-soft);
  }
  .hero-cta{
    margin-top: 2rem;
  }
  .btn-primary{
    background: var(--ink);
    color: #F6F1F5;
    border: none;
    padding: 0.9rem 2rem;
    border-radius: 60% 40% 55% 45% / 55% 50% 50% 45%;
    font-family: 'Work Sans', sans-serif;
    font-size: 0.95rem;
    font-weight: 500;
    cursor: pointer;
    transition: border-radius 0.5s ease, transform 0.3s ease, background 0.3s ease;
  }
  .btn-primary:hover{
    border-radius: 45% 55% 40% 60% / 50% 45% 55% 50%;
    transform: translateY(-2px);
    background: #3B3546;
  }

  /* ---------- exclusives ---------- */
  section.exclusivas{
    padding: 1rem clamp(1.5rem, 6vw, 4rem) 6rem;
    max-width: 1080px;
    margin: 0 auto;
  }
  .exclusivas-head{
    text-align:center;
    margin-bottom: 3rem;
  }
  .exclusivas-head h2{
    font-size: clamp(1.7rem, 3.5vw, 2.2rem);
    font-weight: 500;
  }
  .exclusivas-head h2 em{
    font-style: italic;
    color: #8C5E7A;
  }
  .exclusivas-head p{
    margin-top: 0.6rem;
    color: var(--ink-soft);
    font-size: 0.95rem;
  }

  .grid{
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1.5rem;
  }

  .card{
    background: var(--card);
    border: 1px solid var(--card-line);
    backdrop-filter: blur(6px);
    padding: 1.8rem 1.6rem 1.9rem;
    display:flex;
    flex-direction: column;
    gap: 1.2rem;
    transition: transform 0.4s ease, background 0.4s ease;
  }
  .card:nth-child(1){ border-radius: 38% 62% 55% 45% / 45% 40% 60% 55%; }
  .card:nth-child(2){ border-radius: 55% 45% 40% 60% / 60% 50% 50% 40%; }
  .card:nth-child(3){ border-radius: 42% 58% 62% 38% / 50% 55% 45% 50%; }

  .card:hover{
    transform: translateY(-5px);
    background: rgba(255,255,255,0.55);
  }

  .swatch{
    width: 100%;
    aspect-ratio: 4/3;
    border-radius: inherit;
    display:flex;
    align-items:center;
    justify-content:center;
    background: rgba(255,255,255,0.35);
  }
  .swatch svg{ width: 46%; height: 46%; opacity: 0.85; }

  .card .tag{
    font-size: 0.75rem;
    color: var(--ink-soft);
  }
  .card h3{
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 500;
    font-size: 1.35rem;
  }
  .card .row{
    display:flex;
    justify-content: space-between;
    align-items:center;
    margin-top: auto;
  }
  .price{ font-size: 1rem; color: var(--ink); }
  .buy{
    background: transparent;
    border: 1px solid rgba(74,66,88,0.35);
    color: var(--ink);
    font-family: 'Work Sans', sans-serif;
    font-size: 0.82rem;
    padding: 0.5rem 1.1rem;
    border-radius: 30px;
    cursor: pointer;
    transition: background 0.3s ease, color 0.3s ease;
  }
  .buy:hover, .buy:focus-visible{
    background: var(--ink);
    color: #F6F1F5;
  }

  footer{
    text-align:center;
    padding: 2rem 1.5rem 2.6rem;
    color: var(--ink-soft);
    font-size: 0.82rem;
  }

  @media (max-width: 820px){
    .grid{ grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header>
  <div class="wordmark display"><em>jellliesjellies</em></div>
  <a class="insta-link" href="#" aria-label="Instagram">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
      <rect x="3" y="3" width="18" height="18" rx="5"/>
      <circle cx="12" cy="12" r="4"/>
      <circle cx="17.2" cy="6.8" r="0.6" fill="currentColor" stroke="none"/>
    </svg>
  </a>
</header>

<section class="hero">
  <div class="avatar">
    <img src="avatar.png" alt="jellliesjellies">
  </div>
  <h1 class="display">jellliesjellies</h1>
  <p class="tagline">pretty feet, I know you can see</p>
  <p class="sub">You can order exclusive content below (ADULTS ONLY)</p>
  <div class="hero-cta">
    <button class="btn-primary" onclick="document.getElementById('exclusivas').scrollIntoView()">Ver exclusivas</button>
  </div>
</section>

<section class="exclusives" id="exclusives">
  <div class="exclusivas-head">
    <h2 class="display">Buy <em>exclusives</em></h2>
    <p>Available to you</p>
  </div>

  <div class="grid">

    <div class="card">
      <div class="swatch">
        <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M35 85 C25 85 20 75 22 62 C24 50 20 40 25 28 C29 18 40 15 44 25 C47 33 44 40 46 48 C48 56 58 55 62 46 C65 38 62 28 66 20 C70 12 80 15 82 26 C84 38 78 48 78 60 C78 74 68 85 55 85 Z" fill="#8C5E7A" fill-opacity="0.55"/>
        </svg>
      </div>
      <span class="tag">Video (3 min) + 3 photos</span>
      <h3 class="display"></h3>
      <div class="row">
        <span class="price">USD 50</span>
        <button class="buy">Buy</button>
      </div>
    </div>

    <div class="card">
      <div class="swatch">
        <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M35 85 C25 85 20 75 22 62 C24 50 20 40 25 28 C29 18 40 15 44 25 C47 33 44 40 46 48 C48 56 58 55 62 46 C65 38 62 28 66 20 C70 12 80 15 82 26 C84 38 78 48 78 60 C78 74 68 85 55 85 Z" fill="#6B87A0" fill-opacity="0.55"/>
        </svg>
      </div>
      <span class="tag">Video (5 min) + 5 photos</span>
      <h3 class="display"></h3>
      <div class="row">
        <span class="price">USD 55</span>
        <button class="buy">Buy</button>
      </div>
    </div>

    <div class="card">
      <div class="swatch">
        <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M35 85 C25 85 20 75 22 62 C24 50 20 40 25 28 C29 18 40 15 44 25 C47 33 44 40 46 48 C48 56 58 55 62 46 C65 38 62 28 66 20 C70 12 80 15 82 26 C84 38 78 48 78 60 C78 74 68 85 55 85 Z" fill="#A0688F" fill-opacity="0.55"/>
        </svg>
      </div>
      <span class="tag">Video 10 min</span>
      <h3 class="display"></h3>
      <div class="row">
        <span class="price">USD 100</span>
        <button class="buy">Buy</button>
      </div>
    </div>

  </div>
</section>

<footer>
  jellliesjellies · exclusive content
</footer>

</body>
</html>
